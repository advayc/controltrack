name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build helper
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" -O helper/main.swift \
            -o "$RUNNER_TEMP/controltrack-helper" \
            -framework SwiftUI -framework AppKit -framework IOKit
      - name: Run helper self-test
        run: '"$RUNNER_TEMP/controltrack-helper" --self-test'
